</style></head><body><header><a href="./index.html">← Back to Command Ledger</a></header><main><h1>Import deck from text</h1><p>Paste a decklist from Moxfield, Archidekt, MTGGoldfish, or another source that lists one card per line. Commander sections are recognized, and sideboard and maybeboard cards are excluded.</p><section id="moxImport"><label for="importDeckName">Deck name</label><input id="importDeckName" placeholder="Enter your deck name"><label for="importCommander">Commander</label><input id="importCommander" placeholder="Auto-filled when marked in your list"><label for="importText">Decklist</label><textarea id="importText" placeholder="COMMANDER:&#10;1 Atraxa, Praetors' Voice (2X2) 169&#10;MAINBOARD:&#10;1 Sol Ring (CMM) 410&#10;1 Arcane Signet (CMM) 951"></textarea><button id="parseImported" type="button">Preview and validate deck</button><p id="importStatus" role="status"></p><div id="importPreview"></div><button id="saveImported" type="button" disabled>Save imported deck to cloud</button></section></main><script type="module" src="./moxfield-import.js"></script></body></html>
