<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find Players | Command Ledger</title><link rel="stylesheet" href="./command-ledger-theme.css">
<style>body{margin:0;padding:24px;min-height:100vh}main{max-width:800px;margin:40px auto}.panel{padding:28px;border:1px solid #38514d;border-radius:16px;background:#142528}h1{font:600 clamp(32px,5vw,48px) Georgia,serif}a{color:#a9d9c5}input{width:100%;padding:14px;border:1px solid #49645e;border-radius:9px;background:#0c1c1f;color:#fff;font-size:17px}button{padding:12px 20px;border:1px solid #7f9e8c;border-radius:9px;background:#205d4d;color:white;cursor:pointer}.search{display:flex;gap:10px}.search input{flex:1;min-width:0}.result{padding:16px 0;border-bottom:1px solid #38514d;display:flex;align-items:center;gap:14px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#205d4d;color:white;font:600 22px Georgia,serif}.muted{color:#a9b9b2}.status{margin:18px 0;color:#d9c99e}@media(max-width:520px){.search{flex-direction:column}}</style></head>
<body><main><nav><a href="./index.html">← My Decks</a> · <a href="./profile.html">My Profile</a></nav><section class="panel"><h1>Find Players</h1><p class="muted">Search for Command Ledger players by username. Enter at least three characters.</p><form id="playerSearch" class="search"><input id="username" maxlength="20" minlength="3" placeholder="Search username" autocomplete="off" aria-label="Username" required><button type="submit">Search</button></form><p id="status" class="status" role="status">Sign in to search for players.</p><div id="results" aria-live="polite"></div></section></main>
<script type="module">
import {createClient} from './vendor/supabase-js.mjs';
const sb=createClient('https://enhzzsjccvthrwolxobr.supabase.co','sb_publishable_Vu_wsXslcziuawF7L8cfrw_p9QKmZMT');
const form=document.getElementById('playerSearch'),input=document.getElementById('username'),status=document.getElementById('status'),results=document.getElementById('results');
let signedIn=false;
async function check(){const {data:{user}}=await sb.auth.getUser();signedIn=!!user;form.querySelector('button').disabled=!signedIn;status.textContent=signedIn?'Search usernames to find other players.':'Please sign in from My Profile before searching.'}
form.addEventListener('submit',async event=>{event.preventDefault();results.replaceChildren();const term=input.value.trim().toLowerCase();if(!signedIn){status.textContent='Please sign in first.';return}if(!/^[a-z0-9_]{3,20}$/.test(term)){status.textContent='Enter at least three letters, numbers, or underscores.';return}status.textContent='Searching…';form.querySelector('button').disabled=true;try{const {data,error}=await sb.rpc('search_player_handles',{search_term:term});if(error)throw error;status.textContent=data.length?data.length+' player'+(data.length===1?'':'s')+' found.':'No matching usernames found.';for(const player of data){const row=document.createElement('div');row.className='result';const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=(player.player_name||player.username).charAt(0).toUpperCase();const info=document.createElement('div');const name=document.createElement('strong');name.textContent=player.player_name||player.username;const handle=document.createElement('div');handle.className='muted';handle.textContent='@'+player.username;info.append(name,handle);row.append(avatar,info);results.append(row)}}catch(err){status.textContent='Search failed: '+err.message}finally{form.querySelector('button').disabled=!signedIn}});
check();
</script></body></html>
