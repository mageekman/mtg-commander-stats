<title>Find Players | Command Ledger</title><link rel="stylesheet" href="./command-ledger-theme.css">
<style>body{margin:0;padding:24px;min-height:100vh}main{max-width:700px;margin:30px auto}.panel{padding:22px;border:1px solid #38514d;border-radius:16px;background:#142528}h1{font:600 clamp(32px,5vw,48px) Georgia,serif}a{color:#a9d9c5}input{width:100%;padding:14px;border:1px solid #49645e;border-radius:9px;background:#0c1c1f;color:#fff;font-size:17px}button{padding:12px 20px;border:1px solid #7f9e8c;border-radius:9px;background:#205d4d;color:white;cursor:pointer}.panel-heading{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.panel-heading h1{margin:10px 0}.panel-heading button{background:#152d2b;color:#f1ebdb;border-color:#557369;font-weight:650}#playerInviteStatus:empty{display:none}#playerInviteFallback[hidden]{display:none}.search{display:flex;gap:10px}.search input{flex:1;min-width:0}.result{text-decoration:none;color:inherit;cursor:pointer;position:relative;isolation:isolate;min-height:104px;margin:9px 0;border:1px solid #c9aa7560;border-radius:11px;overflow:hidden;background:linear-gradient(110deg,#193a35,#0b171a);display:flex;align-items:flex-end}.result:hover{border-color:#c9aa75;filter:brightness(1.12)}.result:focus-visible{outline:2px solid #a9d9c5;outline-offset:3px}.result-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;z-index:-2}.result-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,17,20,.95),rgba(6,17,20,.68) 52%,rgba(6,17,20,.12)),linear-gradient(0deg,rgba(6,17,20,.55),transparent)}.result-info{padding:14px 18px;min-width:0}.result-name{display:block;font:600 clamp(18px,3vw,23px) Georgia,serif;color:#f1ebdb;overflow-wrap:anywhere}.result-handle{font-size:12px;color:#a9d9c5;margin-top:3px}.result-fallback{position:absolute;right:16px;top:8px;font:600 48px Georgia,serif;color:#a9d9c533}.result-art:not([hidden])~.result-fallback{display:none}.muted{color:#a9b9b2}.status{margin:18px 0;color:#d9c99e}@media(max-width:520px){.search{flex-direction:column}}</style><link rel="stylesheet" href="./site-navigation.css?v=4"><link rel="icon" type="image/png" href="./cl-favicon-black.png?v=black-1"><link rel="apple-touch-icon" href="./cl-favicon-black.png?v=black-1"></head>
<body><nav id="siteNavigation" class="site-top-nav" aria-label="Main navigation"><a href="./index.html">My Decks</a><a href="./ledger.html">My Ledger</a><a href="./find-players.html">Find Players</a><a href="./profile.html">My Profile</a></nav><main><section class="panel"><div class="panel-heading"><h1>Find Players</h1><button id="copyPlayerInvite" type="button">Copy invite link</button></div><p id="playerInviteStatus" class="status" role="status"></p><label id="playerInviteFallback" hidden>Invite URL<input id="playerInviteUrl" type="url" readonly></label><p class="muted">Search for Command Ledger players by username. Enter at least three characters.</p><form id="playerSearch" class="search"><input id="username" maxlength="20" minlength="3" placeholder="Search username" autocomplete="off" aria-label="Username" required><button type="submit">Search</button></form><p id="status" class="status" role="status">Sign in to search for players.</p><div id="results" aria-live="polite"></div></section></main>
<script>
const playerInviteUrl=new URL('./index.html?invite=1',location.href).href;
document.getElementById('copyPlayerInvite').addEventListener('click',async()=>{
 const status=document.getElementById('playerInviteStatus');
 try{await navigator.clipboard.writeText(playerInviteUrl);status.textContent='Invite link copied. Share it to invite someone to Command Ledger.'}
 catch{const input=document.getElementById('playerInviteUrl');input.value=playerInviteUrl;document.getElementById('playerInviteFallback').hidden=false;input.focus();input.select();status.textContent='Copy this link to invite someone to Command Ledger.'}
});
</script><script src="./scryfall-client.js"></script><script type="module">
import {createClient} from './vendor/supabase-js.mjs';
const sb=createClient('https://enhzzsjccvthrwolxobr.supabase.co','sb_publishable_Vu_wsXslcziuawF7L8cfrw_p9QKmZMT');
const form=document.getElementById('playerSearch'),input=document.getElementById('username'),status=document.getElementById('status'),results=document.getElementById('results');
let signedIn=false;
async function check(){const {data:{user}}=await sb.auth.getUser();signedIn=!!user;form.querySelector('button').disabled=!signedIn;status.textContent=signedIn?'Search usernames to find other players.':'Please sign in from My Profile before searching.'}
form.addEventListener('submit',async event=>{event.preventDefault();results.replaceChildren();const term=input.value.trim().toLowerCase();if(!signedIn){status.textContent='Please sign in first.';return}if(!/^[a-z0-9_]{3,20}$/.test(term)){status.textContent='Enter at least three letters, numbers, or underscores.';return}status.textContent='Searching…';form.querySelector('button').disabled=true;try{const {data,error}=await sb.rpc('search_player_handles',{search_term:term});if(error)throw error;status.textContent=data.length?data.length+' player'+(data.length===1?'':'s')+' found.':'No matching usernames found.';for(const player of data){const row=document.createElement('a');row.className='result';row.href='./player.html?user='+encodeURIComponent(player.username);row.setAttribute('aria-label','View '+(player.player_name||player.username)+' player passport');const shade=document.createElement('div');shade.className='result-shade';const info=document.createElement('div');info.className='result-info';const name=document.createElement('strong');name.className='result-name';name.textContent=player.player_name||player.username;const handle=document.createElement('div');handle.className='result-handle';handle.textContent='@'+player.username;info.append(name,handle);const fallback=document.createElement('div');fallback.className='result-fallback';fallback.textContent=(player.player_name||player.username).charAt(0).toUpperCase();row.append(shade,info,fallback);results.append(row);if(player.favorite_commander){const art=document.createElement('img');art.className='result-art';art.alt='';art.hidden=true;row.prepend(art);const commander=player.favorite_commander;window.commandLedgerScryfallFetch('https://api.scryfall.com/cards/named?exact='+encodeURIComponent(commander)).then(response=>{if(!response.ok)throw Error('Artwork unavailable');return response.json()}).then(card=>{const image=card.image_uris?.art_crop||card.card_faces?.find(face=>face.image_uris?.art_crop)?.image_uris?.art_crop||card.image_uris?.normal||card.card_faces?.find(face=>face.image_uris?.normal)?.image_uris?.normal;if(image&&row.isConnected){art.onload=()=>{art.hidden=false};art.src=image}}).catch(()=>{})}}}catch(err){status.textContent='Search failed: '+err.message}finally{form.querySelector('button').disabled=!signedIn}});
check();
</script></body></html>
