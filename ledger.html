<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Ledger · Command Ledger</title><style>
body{font:15px system-ui;background:#101827;color:#f1f5f9;max-width:1000px;margin:auto;padding:22px}a{color:#a7f3d0}header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}section{background:#1e293b;border-radius:12px;padding:20px;margin:16px 0}input,select,textarea,button{font:inherit;box-sizing:border-box;padding:10px;border:1px solid #64748b;border-radius:7px;background:#0f172a;color:white}button{background:#047857;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}label{display:grid;gap:6px;margin:12px 0}input,select,textarea{width:100%}textarea{min-height:70px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.stat{background:#0f172a;padding:14px;border-radius:9px}.stat strong{font-size:25px;display:block}.muted{color:#94a3b8}.entry{padding:12px 0;border-bottom:1px solid #334155;display:flex;justify-content:space-between;gap:12px;align-items:center}.entry:last-child{border:0}.entry button{background:#334155}#message{min-height:20px}h1{margin-bottom:4px}
.player-row{background:#0f172a;border:1px solid #334155;border-radius:9px;padding:12px;margin:10px 0}.player-row h4{margin:0 0 8px}.player-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player-row label{margin:4px 0}.player-row button{background:#334155;margin-top:8px}@media(max-width:600px){.player-fields{grid-template-columns:1fr}}.commander-search{position:relative;min-width:0}.commander-search input{margin:0}.commander-suggestions{position:absolute;top:100%;left:0;right:0;z-index:30;max-height:230px;overflow-y:auto;background:#152238;border:1px solid #64748b;border-radius:7px;box-shadow:0 12px 28px #0008;padding:4px}.commander-suggestions[hidden],.commander-link[hidden]{display:none}.commander-option{display:block;width:100%;text-align:left;padding:9px;background:transparent;border:0;border-radius:4px;color:#f1f5f9}.commander-option:hover,.commander-option:focus{background:#334155}.commander-link{display:inline-block;margin-top:6px;font-size:12px}.history-commanders{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px;font-size:12px}.history-commanders a{color:#a7f3d0}</style></head><body><header><a href="./index.html">← My decks</a><h1>My Ledger</h1></header><p class="muted">Track your Commander games privately in your cloud account.</p><p id="message" role="status">Checking account…</p>
<section><h2>Record a game</h2><form id="gameForm"><div class="grid"><label>Your deck<select id="deck" required><option value="">Loading decks…</option></select></label><label>Game date<input id="date" type="date" required></label></div><h3>Players and commanders</h3><p class="muted">You're Player 1. Add the other players at your table.</p><div id="playerRows"></div><button type="button" id="addPlayer">+ Add player</button> <button type="button" id="removePlayer">− Remove player</button><div class="grid"><label>Who went first?<select id="firstPlayer" required></select></label><label>Who won?<select id="winnerPlayer" required></select></label></div><label>Notes (optional)<textarea id="notes" placeholder="Memorable plays, how the game ended…"></textarea></label><button id="save" type="submit">Save game to cloud</button></form></section>
<section><h2>My statistics</h2><div id="summary" class="stats"></div><h3>By deck</h3><div id="deckStats"></div></section>
<section><h2>Game history</h2><div id="history"></div></section>
<script type="module" src="./ledger.js"></script></body></html>
