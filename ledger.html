<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Ledger · Command Ledger</title><style>
body{font:15px system-ui;background:#101827;color:#f1f5f9;max-width:1000px;margin:auto;padding:22px}a{color:#a7f3d0}header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}section{background:#1e293b;border-radius:12px;padding:20px;margin:16px 0}input,select,textarea,button{font:inherit;box-sizing:border-box;padding:10px;border:1px solid #64748b;border-radius:7px;background:#0f172a;color:white}button{background:#047857;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}label{display:grid;gap:6px;margin:12px 0}input,select,textarea{width:100%}textarea{min-height:70px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.stat{background:#0f172a;padding:14px;border-radius:9px}.stat strong{font-size:25px;display:block}.muted{color:#94a3b8}.entry{padding:12px 0;border-bottom:1px solid #334155;display:flex;justify-content:space-between;gap:12px;align-items:center}.entry:last-child{border:0}.entry button{background:#334155}#message{min-height:20px}h1{margin-bottom:4px}
.player-row{background:#0f172a;border:1px solid #334155;border-radius:9px;padding:12px;margin:10px 0}.player-row h4{margin:0 0 8px}.player-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player-row label{margin:4px 0}.player-row button{background:#334155;margin-top:8px}@media(max-width:600px){.player-fields{grid-template-columns:1fr}}.commander-search{position:relative;min-width:0}.commander-search input{margin:0}.commander-suggestions{position:absolute;top:100%;left:0;right:0;z-index:30;max-height:230px;overflow-y:auto;background:#152238;border:1px solid #64748b;border-radius:7px;box-shadow:0 12px 28px #0008;padding:4px}.commander-suggestions[hidden],.commander-link[hidden]{display:none}.commander-option{display:block;width:100%;text-align:left;padding:9px;background:transparent;border:0;border-radius:4px;color:#f1f5f9}.commander-option:hover,.commander-option:focus{background:#334155}.commander-link{display:inline-block;margin-top:6px;font-size:12px}.history-commanders{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px;font-size:12px}.history-commanders a{color:#a7f3d0}
/* Four seats surrounding a Commander table */
.pod-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,.6fr) minmax(0,1fr);grid-template-rows:auto minmax(115px,auto) auto;gap:14px;align-items:center;margin:20px 0 14px}
.pod-layout .player-row{margin:0;min-width:0;position:relative;z-index:1;box-shadow:0 5px 20px #0003}
.pod-layout .player-fields{grid-template-columns:minmax(0,1fr)}
.pod-layout .player-row:nth-child(1){grid-column:2;grid-row:3;border-color:#34d399}
.pod-layout .player-row:nth-child(2){grid-column:2;grid-row:1}
.pod-layout .player-row:nth-child(3){grid-column:1;grid-row:2}
.pod-layout .player-row:nth-child(4){grid-column:3;grid-row:2}
.pod-layout .pod-table{grid-column:2;grid-row:2;border:2px solid #496275;border-radius:42px;min-height:110px;background:radial-gradient(ellipse at center,#22554b,#143a39 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#d1fae5;text-align:center;box-shadow:inset 0 0 0 5px #ffffff0b}
.pod-table strong{font-size:15px;letter-spacing:.1em}.pod-table span{font-size:12px;opacity:.8}
.pod-layout .player-row h4{color:#d1fae5}
.pod-layout .commander-suggestions{z-index:50}
.pod-layout:has(.player-row:nth-child(5)){grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto;align-items:stretch}
.pod-layout:has(.player-row:nth-child(5)) .player-row{grid-column:auto;grid-row:auto}
.pod-layout:has(.player-row:nth-child(5)) .pod-table{display:none}
@media(max-width:700px){
 .pod-layout{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto;gap:10px}
 .pod-layout .player-row:nth-child(n){grid-column:auto;grid-row:auto}
 .pod-layout .pod-table{display:none}
 .pod-layout:has(.player-row:nth-child(5)){grid-template-columns:repeat(2,minmax(0,1fr))}
 .pod-layout .player-row{padding:10px}
}
@media(max-width:430px){.pod-layout,.pod-layout:has(.player-row:nth-child(5)){grid-template-columns:minmax(0,1fr)}}

.pod-layout .player-row{overflow:visible;isolation:isolate;background:#0f172a;min-height:205px}
.pod-layout .commander-art{position:absolute;inset:0;z-index:-1;border-radius:inherit;background-position:center 30%;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity .25s}
.pod-layout .has-commander-art .commander-art{opacity:.62}
.pod-layout .has-commander-art::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:linear-gradient(180deg,#07111fe0 0%,#07111fa8 35%,#07111fe8 100%)}
.pod-layout .player-row h4,.pod-layout .player-row label{position:relative}
.pod-layout .player-row input{background:#0f172ade}

/* Compact 2-by-2 pod layout, with additional players flowing into new rows. */
.pod-layout,.pod-layout:has(.player-row:nth-child(5)){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto;align-items:stretch;gap:14px}
.pod-layout .player-row:nth-child(n),.pod-layout:has(.player-row:nth-child(5)) .player-row:nth-child(n){grid-column:auto;grid-row:auto}
.pod-layout .pod-table{display:none}
@media(max-width:430px){.pod-layout,.pod-layout:has(.player-row:nth-child(5)){grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pod-layout .player-row{padding:8px}.pod-layout .player-row input{padding:7px;font-size:13px}}

.game-record{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:16px;margin:14px 0}
.game-record-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.game-record-header strong{font-size:17px}.game-record-header div div{color:#94a3b8;margin-top:3px}
.game-record-header button{background:#334155}
.history-pod{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.history-player{position:relative;min-height:190px;overflow:hidden;border:1px solid #475569;border-radius:11px;background:#17263b;display:flex;align-items:flex-end;isolation:isolate}
.history-player-art{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center 28%;background-repeat:no-repeat}
.history-player::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#06121e38 0%,#06121e55 32%,#06121ef2 100%)}
.history-player-info{width:100%;padding:14px;min-width:0;display:flex;flex-direction:column;gap:5px}
.history-player-info strong{font-size:18px;line-height:1.2;overflow-wrap:anywhere;text-shadow:0 2px 4px #000}
.history-player-info a{color:#d1fae5;font-size:14px;font-weight:600;overflow-wrap:anywhere;text-decoration:underline;text-decoration-color:#d1fae580;text-underline-offset:3px}
.history-player-tags{display:flex;gap:6px;flex-wrap:wrap}
.history-player-tags span{background:#0f172ad9;border:1px solid #94a3b866;padding:4px 7px;border-radius:99px;font-size:11px;font-weight:700}
.history-winner{border:2px solid #34d399}
.history-winner .history-player-tags span:first-child{background:#065f46;color:#ecfdf5;border-color:#34d399}
.history-note{color:#cbd5e1;margin:12px 0 0;white-space:pre-wrap}
@media(max-width:430px){.history-pod{gap:8px}.history-player{min-height:155px}.history-player-info{padding:9px}.history-player-info strong{font-size:15px}.history-player-info a{font-size:12px}}

/* Compact saved-game cards */
#history{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px;align-items:start}
#history>.game-record{margin:0;padding:10px;border-radius:10px;min-width:0}
#history .game-record-header{margin-bottom:8px;gap:8px}
#history .game-record-header strong{font-size:14px}
#history .game-record-header div div{font-size:12px;margin-top:2px}
#history .game-record-header button{font-size:12px;padding:6px 9px}
#history .history-pod{gap:6px}
#history .history-player{min-height:100px;border-radius:7px}
#history .history-player-info{padding:7px;gap:2px}
#history .history-player-info strong{font-size:13px}
#history .history-player-info a{font-size:11px;line-height:1.2}
#history .history-player-tags{gap:3px}
#history .history-player-tags span{font-size:9px;padding:2px 5px}
#history .history-note{font-size:12px;margin-top:7px}
@media(max-width:430px){#history{grid-template-columns:minmax(0,1fr)}#history .history-player{min-height:105px}}
</style></head><body><header><a href="./index.html">← My decks</a><h1>My Ledger</h1></header><p class="muted">Track your Commander games privately in your cloud account.</p><p id="message" role="status">Checking account…</p>
<section><h2>Record a game</h2><form id="gameForm"><div class="grid"><label>Your deck<select id="deck" required><option value="">Loading decks…</option></select></label><label>Game date<input id="date" type="date" required></label></div><h3>Players and commanders</h3><p class="muted">You're Player 1. Add the other players at your table.</p><div id="playerRows" class="pod-layout"></div><button type="button" id="addPlayer">+ Add player</button> <button type="button" id="removePlayer">− Remove player</button><div class="grid"><label>Who went first?<select id="firstPlayer" required></select></label><label>Who won?<select id="winnerPlayer" required></select></label></div><label>Notes (optional)<textarea id="notes" placeholder="Memorable plays, how the game ended…"></textarea></label><button id="save" type="submit">Save game to cloud</button></form></section>
<section><h2>My statistics</h2><div id="summary" class="stats"></div><h3>By deck</h3><div id="deckStats"></div></section>
<section><h2>Game history</h2><div id="history"></div></section>
<script type="module" src="./ledger.js"></script></body></html>
