const $=id=>document.getElementById(id);
async function loadSharedLedger(handle){return mountSharedLedger($('sharedLedger'),{client:sb,handle})}
async function run(){const params=new URLSearchParams(location.search);
// Saved embedded-preview links now open the current, privacy-filtered preview.
if(params.get('statsOnly')==='1'){params.delete('statsOnly');params.set('previewPublic','1');const target=new URL(location.href);target.search=params.toString();location.replace(target.href);return}
