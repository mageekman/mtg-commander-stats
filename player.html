areer-inside{padding:15px}.profile-card .stat strong{font-size:22px}.profile-card .stat small{font-size:11px}}.profile-banner .banner-shade{background:linear-gradient(90deg,rgba(6,17,20,.79) 0%,rgba(6,17,20,.61) 38%,rgba(6,17,20,.12) 100%),linear-gradient(0deg,rgba(6,17,20,.32),transparent 60%)}.profile-banner #commanderShowcase{flex-direction:row;align-items:center;gap:6px;padding:5px 9px;max-width:50%;border-color:#c9aa7540;background:rgba(7,20,22,.66)}.profile-banner #commanderTitle{font-size:12px;font-weight:600}.favorite-heart{width:13px;height:13px;flex:none;fill:#c9aa75;stroke:#e3c797;stroke-width:1.2}@media(max-width:550px){.profile-banner .banner-shade{background:linear-gradient(90deg,rgba(6,17,20,.79),rgba(6,17,20,.33)),linear-gradient(0deg,rgba(6,17,20,.66),transparent)}.profile-banner #commanderShowcase{max-width:72%;padding:4px 7px}}.profile-card .profile-banner{width:100%;min-height:300px;overflow:hidden}.profile-card .profile-banner>img#commanderArt{position:absolute;top:0;right:0;bottom:0;left:0;display:block;width:100%;height:100%;min-width:100%;min-height:100%;max-width:none;max-height:none;object-fit:cover;object-position:center center;border:0;border-radius:0;z-index:0}.profile-card .profile-banner>img#commanderArt[hidden]{display:none}
main{max-width:800px}.profile-card{margin-top:25px}.profile-banner{min-height:310px}.passport-status{padding:16px 0;color:#d9c99e}
.shared-section{margin-top:22px;padding:22px;border:1px solid #38514d;border-radius:14px;background:#142528}.shared-section h3{font:600 25px Georgia,serif;margin:0 0 14px}.shared-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}.shared-stat{background:#0c1c1f;border:1px solid #38514d;border-radius:10px;padding:14px}.shared-stat strong{display:block;font:600 26px Georgia,serif}.shared-stat span{font-size:12px;color:#a9b9b2}.shared-featured{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:18px 0}.shared-feature{position:relative;isolation:isolate;min-height:155px;display:flex;align-items:end;overflow:hidden;border:1px solid #c9aa7560;border-radius:12px;background:#0c1c1f}.shared-feature img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}.shared-feature:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,#07141bf5,#07141b55)}.shared-feature-content{padding:16px}.shared-feature-content strong{display:block;font:600 22px Georgia,serif}.shared-feature-content small{color:#d1dcd5}.shared-decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px}.shared-deck{padding:13px;border:1px solid #38514d;border-radius:10px;background:#0c1c1f}.shared-deck strong{display:block}.shared-deck small{color:#a9b9b2}</style></head><body><main><div class="top"><nav><a href="./find-players.html">← Find Players</a><a href="./index.html">My Decks</a></nav></div><p id="status" class="passport-status" role="status">Loading player passport…</p>
<section id="passport" class="panel profile-card" hidden><div class="profile-banner"><div id="commanderShowcase" hidden><svg class="favorite-heart" viewBox="0 0 24 24" aria-label="Favorite commander" role="img"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg><strong id="commanderTitle"></strong></div><img id="commanderArt" alt="Favorite commander artwork" hidden><div class="banner-shade"></div><div class="banner-content"><span class="eyebrow">PLAYER PASSPORT</span><h2 id="playerName"></h2><div class="profile-meta"><span id="playerHandle" class="handle"></span><span id="playerPronouns"></span></div><p id="playerBio" class="bio"></p><p id="memberSince" class="private"></p></div></div><div class="career-inside" id="publicCareer" hidden><div class="career-heading"><h3>Commander Career</h3></div><div class="stat-grid" id="publicStats"></div></div></section><section class="shared-section" id="sharedLedger" hidden><h3>Ledger Statistics</h3><div id="sharedTotals" class="shared-grid"></div><div id="sharedFeatured" class="shared-featured"></div><h3>By Deck</h3><div id="sharedDecks" class="shared-decks"></div><div id="sharedRivals" class="shared-grid" style="margin-top:18px"></div></section></main>
<script src="./scryfall-client.js"></script><script type="module">
import {createClient} from './vendor/supabase-js.mjs';
const sb=createClient('https://enhzzsjccvthrwolxobr.supabase.co','sb_publishable_Vu_wsXslcziuawF7L8cfrw_p9QKmZMT');
const $=id=>document.getElementById(id);
async function loadSharedLedger(handle){
 const {data,error}=await sb.rpc('get_shared_ledger_stats',{target_handle:handle});if(error||!data)return;
 const games=Number(data.games)||0,wins=Number(data.wins)||0,losses=games-wins;
 const addStat=(host,label,value)=>{const box=document.createElement('div');box.className='shared-stat';const strong=document.createElement('strong');strong.textContent=String(value);const caption=document.createElement('span');caption.textContent=label;box.append(strong,caption);host.append(box)};
 addStat($('sharedTotals'),'Games played',games);addStat($('sharedTotals'),'Wins',wins);addStat($('sharedTotals'),'Losses',losses);addStat($('sharedTotals'),'Win rate',games?(100*wins/games).toFixed(1)+'%':'—');
 const decks=(data.decks||[]).filter(d=>Number(d.games)>0);
 const best=decks.slice().sort((a,b)=>b.wins/b.games-a.wins/a.games||b.games-a.games)[0];
 const most=decks.slice().sort((a,b)=>b.games-a.games||b.wins-a.wins)[0];
 const feature=(label,deck)=>{if(!deck)return;const card=document.createElement('div');card.className='shared-feature';const info=document.createElement('div');info.className='shared-feature-content';const title=document.createElement('small');title.textContent=label;const name=document.createElement('strong');name.textContent=deck.name;const details=document.createElement('small');details.textContent=deck.commander+' · '+deck.wins+' wins / '+deck.games+' games · '+(100*deck.wins/deck.games).toFixed(1)+'%';info.append(title,name,details);card.append(info);$('sharedFeatured').append(card);setArtwork(card,deck.commander)};
 feature('★ Best deck',best);feature('★ Most played deck',most);
 for(const d of decks){const card=document.createElement('div');card.className='shared-deck';const name=document.createElement('strong');name.textContent=d.name;const commander=document.createElement('small');commander.textContent=d.commander;const record=document.createElement('div');record.textContent=d.wins+' wins · '+d.games+' games · '+(100*d.wins/d.games).toFixed(1)+'%';card.append(name,commander,record);$('sharedDecks').append(card)}
 if(!decks.length){const empty=document.createElement('p');empty.textContent='No deck statistics recorded yet.';$('sharedDecks').append(empty)}
 if(data.nemesis_commander)addStat($('sharedRivals'),'Commander lost to most',data.nemesis_commander.commander+' ('+data.nemesis_commander.losses+' losses)');
 if(data.nemesis_player)addStat($('sharedRivals'),'Player lost to most',data.nemesis_player.player+' ('+data.nemesis_player.losses+' losses)');
 $('sharedLedger').hidden=false;
}
async function setArtwork(card,commander){try{const name=String(commander||'').split(' / ')[0].split(' & ')[0].trim();if(!name)return;const res=await window.commandLedgerScryfallFetch('https://api.scryfall.com/cards/named?exact='+encodeURIComponent(name));if(!res.ok)return;const c=await res.json();const url=c.image_uris?.art_crop||c.card_faces?.find(f=>f.image_uris?.art_crop)?.image_uris?.art_crop;if(!url)return;const img=document.createElement('img');img.alt='';img.src=url;card.prepend(img)}catch{}}
async function run(){const handle=new URLSearchParams(location.search).get('user')||'';if(!/^[a-z0-9_]{3,20}$/.test(handle)){$('status').textContent='Invalid player username.';return}
const {data:{user}}=await sb.auth.getUser();if(!user){$('status').textContent='Sign in to view player passports.';return}
const {data,error}=await sb.rpc('get_player_passport',{target_handle:handle});if(error){$('status').textContent='Could not load passport: '+error.message;return}const p=data?.[0];if(!p){$('status').textContent='Player not found.';return}
$('playerName').textContent=p.display_name||p.handle;$('playerHandle').textContent='@'+p.handle;$('playerPronouns').textContent=p.pronouns||'';$('playerBio').textContent=p.bio||'';$('memberSince').textContent=p.created_at?'Member since '+new Date(p.created_at).toLocaleDateString(undefined,{month:'long',year:'numeric'}):'';$('passport').hidden=false;$('status').hidden=true;loadSharedLedger(handle);
const visible=[['games_played','Games played',v=>String(v)],['total_wins','Wins',v=>String(v)],['win_rate','Win rate',v=>v+'%']];for(const [key,label,format] of visible){if(p[key]===null||p[key]===undefined)continue;const cell=document.createElement('div');cell.className='stat';const value=document.createElement('strong');value.textContent=format(p[key]);const caption=document.createElement('small');caption.textContent=label;cell.append(value,caption);$('publicStats').append(cell)}$('publicCareer').hidden=!$('publicStats').children.length;
if(p.favorite_commander){$('commanderTitle').textContent=p.favorite_commander;$('commanderShowcase').hidden=false;try{const response=await window.commandLedgerScryfallFetch('https://api.scryfall.com/cards/named?exact='+encodeURIComponent(p.favorite_commander));if(!response.ok)return;const card=await response.json();const image=card.image_uris?.art_crop||card.card_faces?.find(f=>f.image_uris?.art_crop)?.image_uris?.art_crop||card.image_uris?.normal||card.card_faces?.find(f=>f.image_uris?.normal)?.image_uris?.normal;if(image){$('commanderArt').src=image;$('commanderArt').hidden=false}}catch{}}}
run();
</script></body></html>
