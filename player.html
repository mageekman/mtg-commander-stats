 const manaSymbols=(code)=>{const holder=document.createElement('span');holder.className='mana-icons';const names={W:'White',U:'Blue',B:'Black',R:'Red',G:'Green'};if(!code||code==='C'){const img=document.createElement('img');img.src='https://svgs.scryfall.io/card-symbols/C.svg';img.alt='Colorless mana';holder.append(img);return holder}for(const c of code){if(!names[c])continue;const img=document.createElement('img');img.src='https://svgs.scryfall.io/card-symbols/'+c+'.svg';img.alt=names[c]+' mana';img.title=names[c];holder.append(img)}return holder};const colorStat=(label,code,detail)=>{const box=document.createElement('div');box.className='shared-stat';const caption=document.createElement('span');caption.textContent=label;const value=document.createElement('strong');if(code)value.append(manaSymbols(code));else value.textContent='No data';const small=document.createElement('small');small.textContent=detail||'';const line=document.createElement('div');line.className='color-stat-line';line.append(value,small);box.append(caption,line);badge(box,({'Most played color':'share_most_played_color','Highest color combo win rate':'share_best_color_combo',"Color combo you've lost to most":'share_lost_to_color'})[label]);rivals.append(box)};
 if(data.color_permissions?.most_played){const top=[...colors].sort((a,b)=>b[1]-a[1])[0];colorStat('Most played color',top?.[0],top?Math.round(100*top[1]/Math.max(1,deckColors.reduce((sum,x)=>sum+(Number(x.d.games)||0),0)))+'% · '+top[1]+' games':'')}
 if(data.color_permissions?.best_combo){const best=[...combos].sort((a,b)=>b[1].wins/b[1].games-a[1].wins/a[1].games||b[1].games-a[1].games)[0];colorStat('Highest color combo win rate',best?.[0],best?Math.round(100*best[1].wins/best[1].games)+'% wins · '+best[1].games+' games':'')}
 if(data.lost_color_enabled){const counts=new Map();for(const c of lossColors)if(c)counts.set(c,(counts.get(c)||0)+1);const top=[...counts].sort((a,b)=>b[1]-a[1])[0];colorStat("Color combo you've lost to most",top?.[0],top?Math.round(100*top[1]/Math.max(1,lossColors.length))+'% losses · '+top[1]+' games':'No recorded losses')}

 if(data.decks_enabled){$('sharedDeckSection').hidden=false;badge($('sharedDeckSection'),'share_deck_stats');const toolbar=document.createElement('div');toolbar.className='shared-deck-toolbar';const search=document.createElement('input');search.placeholder='Search decks or commanders…';search.setAttribute('aria-label','Search decks');const sort=document.createElement('select');for(const [value,label] of [['games','Games played'],['winrate','Win rate'],['name','Name']]){const opt=document.createElement('option');opt.value=value;opt.textContent=label;sort.append(opt)}toolbar.append(search,sort);deckHost.before(toolbar);const decks=data.decks||[];const render=()=>{deckHost.replaceChildren();const filtered=decks.filter(d=>(d.name+' '+d.commander).toLowerCase().includes(search.value.toLowerCase()));filtered.sort((a,b)=>sort.value==='winrate'?(b.wins/b.games-a.wins/a.games):sort.value==='name'?a.name.localeCompare(b.name):b.games-a.games);for(const d of filtered){const card=document.createElement('div');card.className='shared-deck';const art=document.createElement('div');art.className='shared-deck-art';const content=document.createElement('div');content.className='shared-deck-content';const name=document.createElement('strong');name.textContent=d.name;const commander=document.createElement('small');commander.textContent=d.commander;const record=document.createElement('div');record.textContent=d.wins+' wins · '+(d.games-d.wins)+' losses · '+(100*d.wins/d.games).toFixed(1)+'% win rate';content.append(name,commander,record);card.append(art,content);deckHost.append(card);setDeckArtwork(art,d.commander)}if(!filtered.length)deckHost.textContent='No matching decks.'};search.oninput=render;sort.onchange=render;render()}else{deckHost.hidden=true}

async function setDeckArtwork(art,commander){try{const name=String(commander||'').split(' / ')[0].split(' & ')[0].trim();if(!name)return;const res=await window.commandLedgerScryfallFetch('https://api.scryfall.com/cards/named?exact='+encodeURIComponent(name));if(!res.ok)return;const c=await res.json();const url=c.image_uris?.art_crop||c.card_faces?.find(f=>f.image_uris?.art_crop)?.image_uris?.art_crop;if(url){window.commandLedgerArtPosition.apply(art,name);art.style.backgroundImage='url("'+url+'")'}}catch{}}
async function setArtwork(card,commander){try{const name=String(commander||'').split(' / ')[0].split(' & ')[0].trim();if(!name)return;const res=await window.commandLedgerScryfallFetch('https://api.scryfall.com/cards/named?exact='+encodeURIComponent(name));if(!res.ok)return;const c=await res.json();const url=c.image_uris?.art_crop||c.card_faces?.find(f=>f.image_uris?.art_crop)?.image_uris?.art_crop;if(!url)return;const img=document.createElement('img');img.alt='';img.src=url;window.commandLedgerArtPosition.apply(img,name);card.prepend(img)}catch{}}
async function run(){const statsOnly=new URLSearchParams(location.search).get('statsOnly')==='1';const previewPublic=new URLSearchParams(location.search).get('previewPublic')==='1';if(statsOnly){document.body.classList.add('stats-only');const resize=()=>parent.postMessage({type:'ledger-stats-height',height:document.documentElement.scrollHeight},location.origin);new ResizeObserver(resize).observe(document.body);window.addEventListener('load',resize);resize()}const handle=new URLSearchParams(location.search).get('user')||'';if(!/^[a-z0-9_]{3,20}$/.test(handle)){$('status').textContent='Invalid player username.';return}
const {data:{user}}=await sb.auth.getUser();if(!user){$('status').textContent='Sign in to view player passports.';return}
if(statsOnly){$('status').hidden=true;const {data:settings,error:settingsError}=await sb.from('profiles').select('handle,public_full_stats,share_record,share_win_chart,share_best_deck,share_most_played_deck,share_most_played_color,share_best_color_combo,share_lost_to_color,share_lost_to_player,share_lost_to_commander,share_deck_stats').eq('id',user.id).maybeSingle();if(settingsError||settings?.handle!==handle){$('sharedLedger').hidden=false;$('sharedLedger').textContent='Could not verify your profile settings.';return}await loadSharedLedger(handle,{own:true,flags:settings,preview:previewPublic});return}const {data,error}=await sb.rpc('get_player_passport',{target_handle:handle});if(error){$('status').textContent='Could not load passport: '+error.message;return}const p=data?.[0];if(!p){$('status').textContent='Player not found.';return}
$('playerName').textContent=p.display_name||p.handle;$('playerHandle').textContent='@'+p.handle;$('playerPronouns').textContent=p.pronouns||'';$('playerBio').textContent=p.bio||'';$('memberSince').textContent=p.created_at?'Member since '+new Date(p.created_at).toLocaleDateString(undefined,{month:'long',year:'numeric'}):'';$('passport').hidden=false;$('status').hidden=true;loadSharedLedger(handle);
const visible=[['games_played','Games played',v=>String(v)],['total_wins','Wins',v=>String(v)],['win_rate','Win rate',v=>v+'%']];for(const [key,label,format] of visible){if(p[key]===null||p[key]===undefined)continue;const cell=document.createElement('div');cell.className='stat';const value=document.createElement('strong');value.textContent=format(p[key]);const caption=document.createElement('small');caption.textContent=label;cell.append(value,caption);$('publicStats').append(cell)}$('publicCareer').hidden=!$('publicStats').children.length;
