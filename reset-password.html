<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password · Command Ledger</title><link rel="stylesheet" href="./command-ledger-theme.css"><style>
body{max-width:680px;margin:0 auto;padding:clamp(18px,4vw,45px)}
header{padding:28px;border:1px solid #617e6a;border-radius:18px;background:linear-gradient(110deg,#162e2c,#2b4638);margin-bottom:22px}
header a{color:#d2dfd2;font-size:13px;text-decoration:none}
.eyebrow{display:block;margin:22px 0 8px;color:var(--cl-gold);font-size:11px;letter-spacing:.2em;font-weight:700}
h1{font-size:clamp(34px,6vw,50px);line-height:1.1;margin:0 0 12px}

</style><link rel="stylesheet" href="./site-navigation.css?v=4"><link rel="stylesheet" href="./site-branding.css?v=3"><script src="./commander-art-position.js?v=manual-3" defer></script><link rel="stylesheet" href="./guest-preview.css?v=first-screen-2"><link rel="stylesheet" href="./friend-notifications.css?v=1"><script type="module" src="./site-session.js?v=cleanup-11"></script><link rel="stylesheet" href="./site-footer.css?v=roadmap-1"><script src="./site-footer.js?v=roadmap-1" defer></script><link rel="icon" type="image/png" href="./cl-favicon-64.png?v=1"><link rel="apple-touch-icon" href="./cl-touch-icon-180.png?v=1"></head><body><a id="siteHomeLogo" href="./index.html" aria-label="Command Ledger home"><img src="./cl-wordmark-final-transparent.webp?v=delivery-1" alt="Command Ledger" width="1608" height="600" loading="eager" decoding="async"></a><nav id="siteNavigation" class="site-top-nav" aria-label="Main navigation"><a href="./index.html">My Decks</a><a href="./ledger.html">My Ledger</a><a href="./friends.html" hidden>Friends</a><a href="./sign-in.html" data-profile-link="true">Sign in/Create Account</a></nav><header><h1 class="site-logo-heading"><a class="site-header-home" href="./index.html" aria-label="Command Ledger home"><img src="./cl-logo-final-transparent.webp?v=delivery-1" alt="" width="988" height="1072" loading="eager"></a><span class="site-heading-title">Reset your password.</span></h1><p>Choose a new password for your archive.</p></header><main><p id="resetStatus" role="status" aria-live="polite">Checking your reset link…</p><form id="resetForm" hidden><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required><button type="submit">Save new password</button></form><a id="returnHome" href="./index.html" hidden>Return to Command Ledger</a></main><script type="module">
import {createClient} from './vendor/supabase-js.mjs';
const sb=createClient('https://enhzzsjccvthrwolxobr.supabase.co','sb_publishable_Vu_wsXslcziuawF7L8cfrw_p9QKmZMT');
const status=document.getElementById('resetStatus'),form=document.getElementById('resetForm'),home=document.getElementById('returnHome');
let recovery=false;
function ready(){recovery=true;form.hidden=false;status.textContent='Reset link verified. Enter your new password.'}
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')ready()});
(async()=>{
try{
const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));
if(params.get('error')||hash.get('error')){status.textContent=params.get('error_description')||hash.get('error_description')||'This reset link is invalid or expired.';return}
if(params.get('code')){const {error}=await sb.auth.exchangeCodeForSession(params.get('code'));if(error)throw error;ready();return}
if(params.get('token_hash')&&params.get('type')==='recovery'){const {error}=await sb.auth.verifyOtp({token_hash:params.get('token_hash'),type:'recovery'});if(error)throw error;ready();return}
if(hash.get('access_token')&&hash.get('type')==='recovery'){const {error}=await sb.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')||''});if(error)throw error;ready();return}
await new Promise(resolve=>setTimeout(resolve,700));
if(!recovery)status.textContent='Open the password reset link from your email. If the link expired, request a new one from the sign-in page.';
}catch(err){status.textContent=err.message||'Could not verify the reset link.'}
})();
form.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a!==b){status.textContent='Passwords do not match.';return}const button=form.querySelector('button');button.disabled=true;status.textContent='Updating your password…';try{const {error}=await sb.auth.updateUser({password:a});if(error)throw error;form.reset();form.hidden=true;home.hidden=false;status.textContent='Password updated. You can return to Command Ledger.'}catch(err){status.textContent=err.message}finally{button.disabled=false}});
</script></body></html>
